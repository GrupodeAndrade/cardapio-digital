server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # arquivos de configuração dos clientes: sempre buscar a versão mais nova
    location /clientes/ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
